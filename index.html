<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Safari do Chico</title>
<meta name="description" content="Jogo estilo Super Nintendo sobre animais e seus ambientes, para crianças que ainda não leem.">
<meta name="theme-color" content="#10101c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Safari">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #10101c;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #tela {
    position: absolute; image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none;
  }
  #girar {
    display: none; position: fixed; inset: 0; z-index: 2; background: #10101c;
    align-items: center; justify-content: center; font-size: 96px;
  }
  #girar span { display: inline-block; animation: girar 2s ease-in-out infinite; }
  @keyframes girar { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (max-width: 1100px) { #girar { display: flex; } }
</style>
</head>
<body>
<canvas id="tela" width="320" height="180"></canvas>
<div id="girar" aria-label="Gire o tablet"><span>📱</span></div>
<script src="src/dados.js"></script>
<script src="src/audio.js"></script>
<script src="src/graficos.js"></script>
<script src="src/jogo.js"></script>
</body>
</html>
